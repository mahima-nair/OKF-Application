[project]
name = "okf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mahima", email = "mrrn.pune@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6.1",
    "ollama>=0.6.2",
    "openai>=2.52.0",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "streamlit>=1.60.0",
]

[project.scripts]
okf = "okf:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
